name: Keep backend awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sS -m 60 -o /dev/null -w "HTTP %{http_code}\n" \
            https://deron-cuts-backend.onrender.com/api/public/configuracion || true
