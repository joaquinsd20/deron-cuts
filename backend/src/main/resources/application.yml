server:
  port: ${PORT:8082}

spring:
  application:
    name: deron-cuts-backend
  datasource:
    url: ${DERON_DB_URL:jdbc:mysql://localhost:3306/deron_cuts?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DERON_DB_USER:deroncuts}
    password: ${DERON_DB_PASSWORD:DeronApp2026}
    hikari:
      # TiDB Serverless puede tardar en "despertar": 30s evita fallos al arrancar.
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      # TiDB cierra conexiones inactivas; se renuevan antes de que ocurra.
      max-lifetime: 240000
      keepalive-time: 60000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  # Correo para el reporte semanal (Gmail). En Render: MAIL_USERNAME = tu Gmail y
  # MAIL_PASSWORD = una "contraseña de aplicación" de Google (no tu contraseña normal).
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  # Zona horaria del negocio (se aplica en DeronCutsApplication via APP_TIMEZONE).
  timezone: ${APP_TIMEZONE:America/Lima}
  jwt:
    # SECRETO - reemplazar en producción con una variable de entorno JWT_SECRET (mínimo 32 bytes)
    secret: ${JWT_SECRET:deron-cuts-proyecto2026-clave-jwt-super-secreta-cambiar-en-produccion-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    # Credencial por defecto para el usuario seed "yumpi" (SOLO demo, cambiar en producción).
    default-password: ${APP_ADMIN_PASSWORD:Yumpi2026!}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  reservas:
    adelanto-porcentaje: ${RESERVA_ADELANTO_PORCENTAJE:50}
    tolerancia-minutos: ${RESERVA_TOLERANCIA_MINUTOS:15}
    penalidad-tardanza: ${RESERVA_PENALIDAD_TARDANZA:10}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,https://deron-cuts.vercel.app,https://deron-cuts-admin.vercel.app}
  recordatorios:
    # Cada cuántos ms se revisan los recordatorios programados (por defecto 30s).
    poll-ms: ${RECORDATORIOS_POLL_MS:30000}

logging:
  level:
    com.deroncuts.barberia: INFO